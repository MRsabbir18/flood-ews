<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="30" y="38" font-size="22" font-weight="700" fill="#0f1f22">Flood Early Warning - wiring</text>
<text x="30" y="60" font-size="13" fill="#445a5d">Every wire is labelled by the ESP32 pin it goes to. GND of every part goes to ESP32 GND.</text>
<rect x="340" y="90" width="220" height="400" rx="10" fill="#e8f3f5" stroke="#0b7f8f" stroke-width="2"/>
<text x="450.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0b7f8f">ESP32 DevKit</text>
<rect x="30" y="100" width="220" height="150" rx="8" fill="#fff8e6" stroke="#b9770e" stroke-width="1.6"/>
<text x="40" y="122" font-size="14" font-weight="700" fill="#0f1f22">JSN-SR04T sensor</text>
<text x="40" y="142" font-size="12" fill="#445a5d" font-family="monospace">VCC  -> 5V (VIN)</text>
<text x="40" y="159" font-size="12" fill="#445a5d" font-family="monospace">GND  -> GND</text>
<text x="40" y="176" font-size="12" fill="#445a5d" font-family="monospace">TRIG -> GPIO 5</text>
<text x="40" y="193" font-size="12" fill="#445a5d" font-family="monospace">ECHO -> divider box below</text>
<rect x="30" y="360" width="220" height="100" rx="8" fill="#eef7ee" stroke="#1b7f3b" stroke-width="1.6"/>
<text x="40" y="382" font-size="14" font-weight="700" fill="#0f1f22">OLED SSD1306 (I2C)</text>
<text x="40" y="402" font-size="12" fill="#445a5d" font-family="monospace">VCC -> 3V3</text>
<text x="40" y="419" font-size="12" fill="#445a5d" font-family="monospace">GND -> GND</text>
<text x="40" y="436" font-size="12" fill="#445a5d" font-family="monospace">SDA -> GPIO 21</text>
<text x="40" y="453" font-size="12" fill="#445a5d" font-family="monospace">SCL -> GPIO 22</text>
<rect x="30" y="265" width="220" height="80" rx="8" fill="#fdeeee" stroke="#c02626" stroke-width="1.6"/>
<text x="40" y="287" font-size="14" font-weight="700" fill="#0f1f22">ECHO voltage divider</text>
<text x="40" y="307" font-size="12" fill="#445a5d" font-family="monospace">ECHO -> 1k -> GPIO 18</text>
<text x="40" y="324" font-size="12" fill="#445a5d" font-family="monospace">GPIO 18 -> 2k -> GND</text>
<rect x="650" y="100" width="220" height="70" rx="8" fill="#f0eefc" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="660" y="122" font-size="14" font-weight="700" fill="#0f1f22">Active buzzer</text>
<text x="660" y="142" font-size="12" fill="#445a5d" font-family="monospace">(+) -> GPIO 25</text>
<text x="660" y="159" font-size="12" fill="#445a5d" font-family="monospace">(-) -> GND</text>
<rect x="650" y="190" width="220" height="120" rx="8" fill="#eef7ee" stroke="#1b7f3b" stroke-width="1.6"/>
<text x="660" y="212" font-size="14" font-weight="700" fill="#0f1f22">3 LEDs (each via 220 ohm)</text>
<text x="660" y="232" font-size="12" fill="#445a5d" font-family="monospace">Green  -> GPIO 26</text>
<text x="660" y="249" font-size="12" fill="#445a5d" font-family="monospace">Yellow -> GPIO 27</text>
<text x="660" y="266" font-size="12" fill="#445a5d" font-family="monospace">Red    -> GPIO 14</text>
<text x="660" y="283" font-size="12" fill="#445a5d" font-family="monospace">other leg -> GND</text>
<rect x="650" y="330" width="220" height="70" rx="8" fill="#eef3f7" stroke="#445a5d" stroke-width="1.6"/>
<text x="660" y="352" font-size="14" font-weight="700" fill="#0f1f22">Rain gauge (optional)</text>
<text x="660" y="372" font-size="12" fill="#445a5d" font-family="monospace">reed switch: GPIO 33 + GND</text>
<rect x="650" y="420" width="220" height="70" rx="8" fill="#eef3f7" stroke="#445a5d" stroke-width="1.6"/>
<text x="660" y="442" font-size="14" font-weight="700" fill="#0f1f22">DHT22 (optional)</text>
<text x="660" y="462" font-size="12" fill="#445a5d" font-family="monospace">data -> GPIO 4, VCC 3V3, GND</text>
<circle cx="340" cy="150" r="5" fill="#0b7f8f"/>
<text x="350" y="154" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">5V / VIN</text>
<circle cx="340" cy="180" r="5" fill="#0b7f8f"/>
<text x="350" y="184" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">GND</text>
<circle cx="340" cy="210" r="5" fill="#0b7f8f"/>
<text x="350" y="214" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 5</text>
<circle cx="340" cy="240" r="5" fill="#0b7f8f"/>
<text x="350" y="244" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 18</text>
<circle cx="340" cy="390" r="5" fill="#0b7f8f"/>
<text x="350" y="394" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">3V3</text>
<circle cx="340" cy="420" r="5" fill="#0b7f8f"/>
<text x="350" y="424" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 21</text>
<circle cx="340" cy="450" r="5" fill="#0b7f8f"/>
<text x="350" y="454" text-anchor="start" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 22</text>
<path d="M250,150 L295.0,150 L295.0,150 L340,150" fill="none" stroke="#b9770e" stroke-width="2"/>
<path d="M250,190 L295.0,190 L295.0,180 L340,180" fill="none" stroke="#445a5d" stroke-width="2"/>
<path d="M250,205 L295.0,205 L295.0,210 L340,210" fill="none" stroke="#b9770e" stroke-width="2"/>
<path d="M250,305 L295.0,305 L295.0,240 L340,240" fill="none" stroke="#c02626" stroke-width="2"/>
<path d="M250,390 L295.0,390 L295.0,390 L340,390" fill="none" stroke="#1b7f3b" stroke-width="2"/>
<path d="M250,420 L295.0,420 L295.0,420 L340,420" fill="none" stroke="#1b7f3b" stroke-width="2"/>
<path d="M250,450 L295.0,450 L295.0,450 L340,450" fill="none" stroke="#1b7f3b" stroke-width="2"/>
<circle cx="560" cy="130" r="5" fill="#0b7f8f"/>
<text x="550" y="134" text-anchor="end" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 25</text>
<circle cx="560" cy="215" r="5" fill="#0b7f8f"/>
<text x="550" y="219" text-anchor="end" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 26</text>
<circle cx="560" cy="245" r="5" fill="#0b7f8f"/>
<text x="550" y="249" text-anchor="end" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 27</text>
<circle cx="560" cy="275" r="5" fill="#0b7f8f"/>
<text x="550" y="279" text-anchor="end" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 14</text>
<circle cx="560" cy="360" r="5" fill="#0b7f8f"/>
<text x="550" y="364" text-anchor="end" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 33</text>
<circle cx="560" cy="450" r="5" fill="#0b7f8f"/>
<text x="550" y="454" text-anchor="end" font-size="12" fill="#0f1f22" font-family="monospace">GPIO 4</text>
<path d="M560,130 L605.0,130 L605.0,130 L650,130" fill="none" stroke="#445a5d" stroke-width="2"/>
<path d="M560,215 L605.0,215 L605.0,215 L650,215" fill="none" stroke="#445a5d" stroke-width="2"/>
<path d="M560,245 L605.0,245 L605.0,245 L650,245" fill="none" stroke="#445a5d" stroke-width="2"/>
<path d="M560,275 L605.0,275 L605.0,275 L650,275" fill="none" stroke="#445a5d" stroke-width="2"/>
<path d="M560,360 L605.0,360 L605.0,360 L650,360" fill="none" stroke="#445a5d" stroke-width="2"/>
<path d="M560,450 L605.0,450 L605.0,450 L650,450" fill="none" stroke="#445a5d" stroke-width="2"/>
<text x="30" y="520" font-size="12" fill="#c02626">Do not connect ECHO straight to the ESP32: it outputs 5 V and the ESP32 pin tolerates 3.3 V.</text>
</svg>